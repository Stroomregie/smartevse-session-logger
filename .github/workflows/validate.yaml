name: Validate

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # brands: requires a PR to github.com/home-assistant/brands, a
          # separate, externally-reviewed repo — tracked, not fixable here.
          ignore: "brands"
